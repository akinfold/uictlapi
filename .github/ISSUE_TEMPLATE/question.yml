name: Usage question
description: Ask how to use uictlapi with a Web UI API request
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, CSRF tokens, public IP addresses, or personal hostnames. UniFi API paths can change between releases, so include the UniFi Network version.
  - type: input
    id: version
    attributes:
      label: uictlapi version
      placeholder: "uictlapi, version 0.1.3"
    validations:
      required: true
  - type: input
    id: network-version
    attributes:
      label: UniFi Network version
      placeholder: "10.5.67"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a sanitized command and output when available.
    validations:
      required: true
