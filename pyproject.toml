[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uictlapi"
version = "0.1.0"
description = "The Ubiquiti Unifi Controller API command line client. Takes care of authentification and CSRF handling and provides convenient curl like interface which makes available use all the features available in the Web UI."
readme = "README.md"
authors = [{name = "Roman Akinfeev", email = "akinfold@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "requests-unifi-auth>=0.1.0",
]
keywords = ["unifi", "ubiquiti", "api", "cli", "networking", "controller", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/akinfold/uictlapi"
Repository = "https://github.com/akinfold/uictlapi"
Issues = "https://github.com/akinfold/uictlapi/issues"

[project.scripts]
uictlapi = "uictlapi.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short"
]

[tool.coverage.run]
source = ["src/"]
omit = [
    "*/tests/*",
    "*/test_*"
]

[tool.poetry.scripts]
build-docker = "scripts.docker:build"
push-docker = "scripts.docker:push"
